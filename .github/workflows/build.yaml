name: Build & Publish
on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  # ── Linux amd64: build + package .deb ──────────────────────────────────────
  build-linux-amd64:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      deb_name: ${{ steps.version.outputs.deb_name }}
      tarball_name: ${{ steps.linux-tarball.outputs.filename }}
    steps:
    - uses: actions/checkout@v4

    - name: Resolve version
      id: version
      run: |
        VER="$(cat VERSION)-orok"
        DEB="orok-qemu_${VER}-1_amd64.deb"
        echo "version=${VER}" >> "$GITHUB_OUTPUT"
        echo "deb_name=${DEB}"  >> "$GITHUB_OUTPUT"

    - name: Install dependencies
      run: |
        (sudo apt-get -oAPT::Get::Update::SourceListWarnings=False update || true)
        sudo apt-get install -y \
          debhelper build-essential ninja-build \
          libglib2.0-dev libssl-dev

    - name: Cache build artifacts
      id: linux-cache-build
      uses: actions/cache@v4
      with:
        key: ${{ runner.os }}-build-${{ hashFiles('configure') }}
        restore-keys: |
          ${{ runner.os }}-build-
        path: build/

    - name: Configure
      if: steps.linux-cache-build.outputs.cache-hit != 'true'
      run: ./configure

    - name: Build
      run: ninja -C build qemu-system-x86_64 qemu-system-aarch64 qemu-system-riscv64

    - name: Create Linux tarball
      id: linux-tarball
      run: |
        VER="${{ steps.version.outputs.version }}"
        FNAME="orok-qemu-${VER}-linux-amd64.tar.gz"
        mkdir -p orok-qemu-linux/bin
        cp build/qemu-system-x86_64  orok-qemu-linux/bin/orok-qemu-system-x86_64
        cp build/qemu-system-aarch64 orok-qemu-linux/bin/orok-qemu-system-aarch64
        cp build/qemu-system-riscv64 orok-qemu-linux/bin/orok-qemu-system-riscv64
        tar -czf "${FNAME}" -C orok-qemu-linux .
        echo "filename=${FNAME}" >> "$GITHUB_OUTPUT"

    - name: Build .deb
      run: |
        VER="${{ steps.version.outputs.version }}"
        sed -i "1s/([^)]*)/($VER-1)/" debian/changelog
        dpkg-buildpackage -us -uc -b
        mv "../orok-qemu_${VER}-1_amd64.deb" "${{ steps.version.outputs.deb_name }}"

    - name: Upload .deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: orok-qemu-deb-amd64
        path: ${{ steps.version.outputs.deb_name }}
        retention-days: 30

    - name: Upload Linux tarball artifact
      uses: actions/upload-artifact@v4
      with:
        name: orok-qemu-tarball-linux-amd64
        path: ${{ steps.linux-tarball.outputs.filename }}
        retention-days: 30

  # ── macOS arm64: build + package tarball ───────────────────────────────────
  build-macos-arm64:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tarball_filename: ${{ steps.tarball.outputs.filename }}
    steps:
    - uses: actions/checkout@v4

    - name: Resolve version
      id: version
      run: |
        VER="$(cat VERSION)-orok"
        echo "version=${VER}" >> "$GITHUB_OUTPUT"

    - name: Install dependencies
      run: brew install ninja pkg-config glib

    - name: Cache build artifacts
      id: mac-cache-build
      uses: actions/cache@v4
      with:
        key: ${{ runner.os }}-build-${{ hashFiles('configure') }}
        restore-keys: |
          ${{ runner.os }}-build-
        path: build/

    - name: Configure
      if: steps.mac-cache-build.outputs.cache-hit != 'true'
      run: ./configure

    - name: Build
      run: ninja -C build qemu-system-x86_64 qemu-system-aarch64 qemu-system-riscv64

    - name: Create macOS tarball
      id: tarball
      run: |
        VER="${{ steps.version.outputs.version }}"
        FNAME="orok-qemu-${VER}-macos-arm64.tar.gz"
        mkdir -p orok-qemu-macos/bin
        cp build/qemu-system-x86_64  orok-qemu-macos/bin/orok-qemu-system-x86_64
        cp build/qemu-system-aarch64 orok-qemu-macos/bin/orok-qemu-system-aarch64
        cp build/qemu-system-riscv64 orok-qemu-macos/bin/orok-qemu-system-riscv64
        tar -czf "${FNAME}" -C orok-qemu-macos .
        echo "filename=${FNAME}" >> "$GITHUB_OUTPUT"

    - name: Upload macOS tarball artifact
      uses: actions/upload-artifact@v4
      with:
        name: orok-qemu-tarball-macos-arm64
        path: ${{ steps.tarball.outputs.filename }}
        retention-days: 30

  # ── Publish everything to GitHub Pages ────────────────────────────────────
  publish:
    needs: [build-linux-amd64, build-macos-arm64]
    runs-on: ubuntu-latest
    steps:
    - name: Install aptly + gpg + expect
      run: |
        echo 'deb [signed-by=/etc/apt/keyrings/aptly.asc] http://repo.aptly.info/release noble main' | sudo tee /etc/apt/sources.list.d/aptly.list
        sudo wget -q -O /etc/apt/keyrings/aptly.asc https://www.aptly.info/pubkey.txt
        (sudo apt-get -oAPT::Get::Update::SourceListWarnings=False update || true)
        sudo apt-get install -y aptly gpg gpg-agent expect

    - name: Import GPG signing key
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
        echo "$GPG_PRIVATE_KEY" | gpg --import --batch --yes
        KEYID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | awk '{print $2}' | cut -d/ -f2)
        # Trust the key unconditionally so aptly can sign without prompts
        expect -c "spawn gpg --edit-key $KEYID trust quit; send \"5\ry\r\"; expect eof"
        echo "GPG_KEY_ID=${KEYID}" >> "$GITHUB_ENV"
        # Export binary (dearmored) key — apt requires this for signed-by keyring files
        gpg --export "$KEYID" > orok-qemu.gpg

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: orok-qemu-*
        merge-multiple: true

    - name: Build APT repository
      run: |
        DEB="${{ needs.build-linux-amd64.outputs.deb_name }}"
        aptly repo create -distribution=stable -component=main orok-qemu
        aptly repo add orok-qemu "$DEB"
        aptly publish repo \
          -distribution=stable \
          -gpg-key="$GPG_KEY_ID" \
          -force-overwrite \
          orok-qemu /orok-qemu
        mkdir -p site/apt
        cp -r ~/.aptly/public/orok-qemu/. site/apt/
        cp orok-qemu.gpg site/orok-qemu.gpg

    - name: Copy tarballs
      run: |
        mkdir -p site/downloads
        cp "${{ needs.build-linux-amd64.outputs.tarball_name }}" site/downloads/
        cp "${{ needs.build-macos-arm64.outputs.tarball_filename }}" site/downloads/

    - name: Write index page
      run: |
        OWNER="${{ github.repository_owner }}"
        REPO="${{ github.event.repository.name }}"
        BASE="https://${OWNER}.github.io/${REPO}"
        cat > site/index.html <<EOF
        <!DOCTYPE html>
        <html>
        <head><meta charset="utf-8"><title>orok-qemu</title></head>
        <body>
        <h1>orok-qemu</h1>
        <h2>Debian/Ubuntu (APT)</h2>
        <pre>
        sudo install -dm 755 /etc/apt/keyrings
        sudo wget -O /etc/apt/keyrings/orok-qemu.gpg ${BASE}/orok-qemu.gpg
        echo "deb [signed-by=/etc/apt/keyrings/orok-qemu.gpg] ${BASE}/apt stable main" \\
          | sudo tee /etc/apt/sources.list.d/orok-qemu.list
        sudo apt-get update
        sudo apt-get install orok-qemu
        </pre>
        <h2>macOS arm64</h2>
        <pre>
        curl -LO ${BASE}/downloads/${{ needs.build-macos-arm64.outputs.tarball_filename }}
        tar -xzf ${{ needs.build-macos-arm64.outputs.tarball_filename }}
        sudo mv bin/orok-qemu-* /usr/local/bin/
        </pre>
        <h2>Linux amd64 (tarball fallback)</h2>
        <pre>
        curl -LO ${BASE}/downloads/${{ needs.build-linux-amd64.outputs.tarball_name }}
        tar -xzf ${{ needs.build-linux-amd64.outputs.tarball_name }}
        sudo mv bin/orok-qemu-* /usr/local/bin/
        </pre>
        </body>
        </html>
        EOF

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

  # ── Deploy to GitHub Pages ─────────────────────────────────────────────────
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
